 .amp { width:1180px; box-sizing:border-box; border-radius:40px; background:#2a1d14; color:#f1ece2; padding:24px 32px; display:grid; grid-template-columns:auto auto 1fr auto; gap:28px; align-items:center; --ink-muted:#d9cbb8; }

  .amp .frk-rotary__bar { background:#e8a33a; }
  .vol { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .lcd { font:400 64px/1 var(--font-dot); color:#ffb547; text-shadow:0 0 12px rgba(255,170,60,.45); background:#120c08; border-radius:14px; padding:14px 22px; font-variant-numeric:tabular-nums; }
  .knobs { display:flex; gap:20px; }
  .amp .frk-dial__label, .amp .cap { color:#d9cbb8; }
  .home { width:380px; height:380px; border-radius:var(--radius-full); background:#d8d3c8; display:grid; place-items:center; position:relative; }
  html[data-theme="dark"] .home { background:#3a3631; }
  .home .ring { position:absolute; inset:30px; border-radius:var(--radius-full); box-shadow: inset 0 0 0 10px var(--klein); }
  .sq { width:380px; min-height:380px; padding:28px 0; box-sizing:border-box; border-radius:40px; background:var(--tabaco); color:var(--on-tabaco); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
