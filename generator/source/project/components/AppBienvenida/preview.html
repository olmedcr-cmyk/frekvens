<!-- @dsCard group="Apps" height=820 page subtitle="Bienvenida: cuatro pasos para una app de préstamo entre vecinos" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AppBienvenida</title>
<style>
  .app { width:min(390px,100%); margin:0 auto; box-sizing:border-box; border-radius:44px; padding:var(--space-6) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); outline-offset:calc(var(--hairline) * -1); overflow:hidden; }
  .bento { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
  .bento > * { min-width:0; }
  .wide { grid-column:1 / -1; }
  .bento .frk-tile { height:100%; }
  .bento .frk-tile__value { font-size:40px; }
  .bento .wide .frk-tile__value { font-size:64px; }
  .card { display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; min-width:0; }
  .cap { margin:0; font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
  .row { display:flex; gap:var(--space-3); align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .list { display:flex; flex-direction:column; gap:var(--space-2); }
  .app .frk-tabbar { align-self:center; }
</style></head>
<body>
<div id="root" class="frk-pad"></div>
<script>
var F = window.Frekvens, h = React.createElement, no = function(){};
function App(){
 return h('div',{className:'app'},
  h('div',{className:'row'},h(F.Text,{variant:'headline',as:'h1'},'Vecina'),h(F.Chip,null,'Beta')),
  h(F.Onboarding,{onSkip:no,slides:[
   {eyebrow:'Pedir',title:'Pide prestado, no compres.',text:'El taladro que usarás una vez ya lo tiene alguien en tu portal.',tone:'sol',art:h(F.Shape,{name:'arch',size:132,tone:'klein'})},
   {eyebrow:'Prestar',title:'Lo que guardas, que sirva.',text:'Ofrece lo que tienes y decide a quién y hasta cuándo.',tone:'salvia',art:h(F.Shape,{name:'steps',size:132,tone:'verde'})},
   {eyebrow:'Confianza',title:'Todo queda apuntado.',text:'Cada préstamo tiene fecha de vuelta y un aviso el día antes.',tone:'lavanda',art:h(F.Shape,{name:'ring',size:132,tone:'rams'})},
   {eyebrow:'Listo',title:'Tu barrio, más a mano.',text:'Empieza por lo que más falta te hace.',tone:'klein-soft',art:h(F.Shape,{name:'cross',size:132,tone:'ink'})}]}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
