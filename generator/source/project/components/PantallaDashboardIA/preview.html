<!doctype html>

<style>
  .screens { display:flex; gap:var(--space-5); padding:var(--space-5); flex-wrap:wrap; align-items:flex-start; }

  .or { display:flex; align-items:center; gap:var(--space-3); font:500 11px/14px var(--font-mono); letter-spacing:.08em; color:var(--ink-muted); }
  .or::before, .or::after { content:''; flex:1; height:1px; background:var(--line); }

  .small a { color:var(--klein-ink); font-weight:700; }
  .frame { position:relative; width:440px; height:440px; border-radius:var(--radius-xl); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }
  .cap { font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); margin-top:var(--space-2); }
  .grid3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--space-2); }
  .wide { width:1180px; box-sizing:border-box; }
 .split { width:1180px; display:grid; grid-template-columns:340px 1fr; gap:var(--space-4); }
  .code { margin:0; padding:var(--space-4); border-radius:var(--radius-lg); background:#0e0e0d; color:#f2f0ea; font:500 11px/17px var(--font-mono); white-space:pre-wrap; word-break:break-word; max-height:880px; overflow:auto; }
  .code b { color:#ffd447; font-weight:500; }
  .dash { padding:var(--space-5); border-radius:var(--radius-xl); background:var(--paper); outline:var(--hairline) solid var(--line); min-width:0; }
</style></head>
