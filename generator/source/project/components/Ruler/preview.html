<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Ruler — preview</title></head>
<body>
<div id="root" class="frk-pad"></div>
<script>
var C = window.Frekvens, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',flexDirection:'column',gap:'24px',maxWidth:'420px'}},
 h(C.Ruler,{label:'Frecuencia',min:87.5,max:108,step:0.1,major:5,pitch:12,defaultValue:98.5,unit:'MHz',format:function(v){return v.toFixed(1).replace('.',',');}}),
 h(C.Ruler,{label:'Día del mes',min:1,max:31,step:1,major:5,pitch:16,defaultValue:14,tone:'klein',format:function(v){return 'Día '+v;}})));
</script>
</body>
</html>
