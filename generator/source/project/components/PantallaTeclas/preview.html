<!-- @dsCard group="Pantallas" height=720 width=1240 page subtitle="Teclas: calculadora, macropad con fader y teclado redondo" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>PantallaTeclas</title>
<style>
  .screens { display:flex; gap:var(--space-5); padding:var(--space-5); flex-wrap:wrap; align-items:flex-start; }
  .phone { position:relative; width:390px; height:800px; box-sizing:border-box; border-radius:48px; padding:var(--space-8) var(--space-5) var(--space-5); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }
  .card { box-sizing:border-box; border-radius:var(--radius-xl); background:var(--surface); padding:var(--space-5); display:flex; flex-direction:column; gap:var(--space-4); }
  .cap { font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); margin:0; }
  .wide { width:1180px; box-sizing:border-box; }
  .row { display:flex; gap:var(--space-4); flex-wrap:wrap; align-items:center; }
  .push { margin-top:auto; }
 .macro { width:380px; box-sizing:border-box; padding:24px; border-radius:var(--radius-xl); background:var(--well); display:grid; grid-template-columns:1fr auto; gap:24px; }
  .macro .keys { display:grid; grid-template-columns:repeat(3, 64px); grid-auto-rows:64px; gap:12px; }

</style></head>
<body>
<div id="root"></div>
<script>
var F = window.Frekvens, h = React.createElement;
function Macro(){var s=React.useState('—');function k(l,o){o=o||{};return h(F.Keycap,{key:l,tone:o.tone,w:o.w,h:o.h,sub:o.sub,onClick:function(){s[1](o.say||l);}},l);}
 return h('div',{className:'macro'},h('div',null,h('p',{className:'cap',style:{marginBottom:'12px'}},'Macro: ',h('b',{'aria-live':'polite'},s[0])),
  h('div',{className:'keys'},k('⌘C',{say:'Copiar',sub:'copy'}),k('⌘V',{say:'Pegar',sub:'paste'}),k('⌘Z',{say:'Deshacer',sub:'undo'}),k('◐',{say:'Modo oscuro',tone:'ink'}),k('★',{say:'Favorito',tone:'sol'}),k('●',{say:'Grabar',tone:'rams'}),k('⏎',{say:'Enviar',w:3,tone:'klein'}))),
  h(F.Fader,{label:'Brillo',defaultValue:60,tone:'sol',height:220}));}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'screens'},h(F.Calculator,{keyboard:true}),h(Macro),h(F.Calculator,{variant:'round'})));
</script>
</body>
</html>
