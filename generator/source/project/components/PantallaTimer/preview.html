<!-- @dsCard group="Pantallas" height=860 page subtitle="Temporizador Tabata — botonera de palma" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Pantalla · Temporizador</title>
<style>
  .screens { display:flex; gap:var(--space-6); padding:var(--space-5); flex-wrap:wrap; }
  .phone { width:390px; height:800px; box-sizing:border-box; border-radius:48px; padding:var(--space-8) var(--space-5) var(--space-5); display:flex; flex-direction:column; gap:var(--space-5); background:var(--paper); outline:var(--hairline) solid var(--line); }
  .phone h1 { margin:0; font:800 40px/.95 var(--font-sans); letter-spacing:-.03em; }
  .phone h1 span { color:var(--ink-muted); display:block; }
  .grow { flex:1; display:flex; align-items:center; justify-content:center; }
  .keys { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
  .bar { display:flex; justify-content:center; }
</style></head>
<body>
<div id="root"></div>
<script>
var C = window.Frekvens, h = React.createElement;
function Setup(){
  var s=React.useState(8), n=s[0];
  return h('div',{className:'phone'},
    h('h1',null,'Tabata',h('span',null,n+' series · 20/10')),
    h('div',{className:'grow'},h(C.DotGrid,{total:12,filled:n>12?12:n,columns:4,size:56,label:n+' series'})),
    h('div',{className:'keys'},
      h(C.KeyButton,{tone:'paper',size:'l',label:'Series',icon:'minus',onClick:function(){s[1](Math.max(1,n-1));},'aria-label':'Quitar serie'}),
      h(C.KeyButton,{tone:'paper',size:'l',label:'Series',icon:'plus',onClick:function(){s[1](Math.min(12,n+1));},'aria-label':'Añadir serie'})),
    h(C.KeyButton,{tone:'rams',size:'xl',block:true,label:'Empezar',icon:'play'},'Start'));
}
function Run(){
  return h('div',{className:'phone',style:{background:'var(--ink)',color:'var(--paper)',outline:'none'}},
    h(C.Chip,{tone:'sol'},'Trabajo · 3/8'),
    h('div',{className:'grow',style:{flexDirection:'column',gap:'24px'}},
      h(C.DotMatrix,{text:'14',dot:16,pitch:22,tone:'paper',label:'14 segundos'}),
      h('div',{className:'frk-cap',style:{color:'var(--paper)'}},'Segundos restantes')),
    h(C.Keypad,{label:'Control',height:'120px',keys:[{icon:'pause',ariaLabel:'Pausa',tone:'klein'},{icon:'stop',ariaLabel:'Parar',tone:'rec'}]}),
    h('div',{className:'bar'},h(C.Segmented,{label:'Navegación',options:[{value:'home',label:'Home'},{value:'lock',icon:'lock',ariaLabel:'Bloquear'}],defaultValue:'lock'})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'screens'},h(Setup),h(Run)));
</script>
</body>
</html>
