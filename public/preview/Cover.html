<meta charset="utf-8">
<title>Frekvens</title>
<style>
  html, body { margin:0; height:100%; }

  .art svg { display:block; }

  .sol { fill:var(--sol); }
  .ink { fill:var(--ink); }
  .rams { fill:var(--rams); }
  .verde { fill:var(--verde); }
  .dot, .knob { fill:var(--paper); }
  .key { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:800; letter-spacing:-.04em; color:var(--ink); }

<body>
<div class="cover">

  scales      joints space-2 (8px); pitch space-3 (12px); key corners radius-lg (24px); pill rx = radius-full (half of 96); dot r = half of dot-size
-->

</div>
