<!doctype html>
<html lang="es">
<head><link rel="stylesheet" href="/preview/frekvens.css"><script src="/preview/react.js"></script><script src="/preview/react-dom.js"></script><script src="/preview/frekvens.js"></script><script>try{var t=parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);new MutationObserver(function(){document.documentElement.setAttribute('data-theme',parent.document.documentElement.getAttribute('data-theme'))}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}</script><meta charset="utf-8"><title>PantallaGraficas</title>
<style>
  .screens { display:flex; gap:var(--space-5); padding:var(--space-5); flex-wrap:wrap; align-items:flex-start; }
  .phone { position:relative; width:390px; height:800px; box-sizing:border-box; border-radius:48px; padding:var(--space-8) var(--space-5) var(--space-5); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }

 .charts { width:1180px; display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .charts .span2 { grid-column:span 2; }

</style></head>
<body>
<div id="root"></div>
<script>
var F = window.Frekvens, h = React.createElement;
function G(){return h('div',{className:'charts'},

  h('div',{className:'card'},h(F.Text,{variant:'title'},'Gasto'),h(F.DonutChart,{label:'Gasto',value:'842',caption:'€ este mes',segments:[{label:'Casa',value:420,tone:'ink'},{label:'Comida',value:210,tone:'rams'},{label:'Ocio',value:120,tone:'sol'},{label:'Otros',value:92,tone:'klein'}]})),

  h('div',{className:'card'},h(F.Text,{variant:'title'},'Perfil'),h(F.RadarChart,{size:280,label:'Perfil',axes:['Fuerza','Cardio','Movilidad','Técnica','Constancia','Descanso'],series:[{label:'Tú',data:[0.8,0.55,0.4,0.7,0.9,0.5]},{label:'Media',data:[0.6,0.6,0.6,0.6,0.6,0.6]}]})),
  h('div',{className:'card'},h(F.Text,{variant:'title'},'Pulso'),h(F.Scope,{width:340,height:160,caption:'ECG simulado',frequency:3,amplitude:0.7}),h(F.Stat,{label:'Media',value:'64',unit:' lpm',delta:'-2 %',inverse:true,trend:[70,68,67,66,65,64]})),
  h('div',{className:'card span2'},h(F.Text,{variant:'title'},'Semana'),h(F.LineChart,{width:720,height:160,data:[4,6,5,8,7,9,6],labels:['L','M','X','J','V','S','D'],now:5,unit:'km',label:'Kilómetros'})),
  h('div',{className:'card'},h(F.Text,{variant:'title'},'Horas pico'),h(F.Heatmap,{data:Array.from({length:84},function(_,i){return Math.round(Math.abs(Math.sin(i*0.7))*10);}),rows:7,cell:22,tone:'rams',label:'Uso por hora'})));}

</script>
</body>
</html>
