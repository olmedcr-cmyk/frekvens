<!doctype html>
<html lang="es">
<head><link rel="stylesheet" href="/preview/frekvens.css"><script src="/preview/react.js"></script><script src="/preview/react-dom.js"></script><script src="/preview/frekvens.js"></script><script>try{if(parent!==window){var t=parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);new MutationObserver(function(){document.documentElement.setAttribute('data-theme',parent.document.documentElement.getAttribute('data-theme'))}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}}catch(e){}</script><meta charset="utf-8"><title>AppCosas</title>
<style>
  .app { width:min(390px,100%); margin:0 auto; box-sizing:border-box; border-radius:44px; padding:var(--space-6) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); overflow:hidden; }
  .bento { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
  .bento > * { min-width:0; }
  .wide { grid-column:1 / -1; }
  .bento .frk-tile { height:100%; }
  .bento .frk-tile__value { font-size:40px; }
  .bento .wide .frk-tile__value { font-size:64px; }
  .card { display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; min-width:0; }
  .cap { margin:0; font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
  .row { display:flex; gap:var(--space-3); align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .list { display:flex; flex-direction:column; gap:var(--space-2); }
  .app .frk-tabbar { align-self:center; }
</style></head>
<body>
<div id="root" class="frk-pad"></div>
<script>
var F = window.Frekvens, h = React.createElement;
function App(){
 return h('div',{className:'app'},
  h(F.Text,{variant:'display-xl',sub:'5 para hoy'},'Cosas'),
  h(F.Segmented,{label:'Periodo',options:['Hoy','Semana','Algún día']}),
  h('div',{className:'bento'},
   h(F.Tile,{tone:'klein',title:'Hoy',subtitle:'pendientes',value:'5',height:152}),
   h(F.Tile,{tone:'surface',title:'Semana',subtitle:'programadas',value:'12',height:152})),
  h('div',{className:'card'},h('p',{className:'cap'},'Esta mañana'),
   h(F.Checkbox,{label:'Llamar al taller',hint:'Antes de las 10:00',defaultChecked:true}),
   h(F.Checkbox,{label:'Enviar la propuesta',hint:'Trabajo'}),
   h(F.Checkbox,{label:'Comprar filtros de café',hint:'Casa'})),
  h('div',{className:'card'},h('p',{className:'cap'},'Esta tarde'),
   h(F.Checkbox,{label:'Reservar mesa para el sábado',hint:'Cuatro personas'}),
   h(F.Checkbox,{label:'Regar las plantas'})),
  h(F.KeyButton,{tone:'ink',shape:'pill',block:true,icon:'plus'},'Nueva cosa'),
  h(F.TabBar,{label:'Secciones',items:[{id:'h',label:'Hoy',icon:'home'},{id:'l',label:'Listas',icon:'dots'},{id:'d',label:'Hecho',icon:'check'}]}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
