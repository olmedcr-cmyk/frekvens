<!doctype html>
<html lang="es">
<head><link rel="stylesheet" href="/preview/frekvens.css"><script src="/preview/react.js"></script><script src="/preview/react-dom.js"></script><script src="/preview/frekvens.js"></script><script>try{var t=parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);new MutationObserver(function(){document.documentElement.setAttribute('data-theme',parent.document.documentElement.getAttribute('data-theme'))}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}</script><meta charset="utf-8"><title>Pantalla · Conversación</title>
<style>
  .screens { display:flex; gap:var(--space-6); padding:var(--space-5); flex-wrap:wrap; }
  .phone { width:390px; height:800px; box-sizing:border-box; border-radius:48px; padding:var(--space-8) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }
  .log { flex:1; display:flex; flex-direction:column; gap:var(--space-5); overflow:auto; padding:0 var(--space-1); }
  .voice { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--space-6); text-align:center; }
  .bar { display:flex; justify-content:center; gap:var(--space-4); }
</style></head>
<body>
<div id="root"></div>
<script>
var F = window.Frekvens, h = React.createElement;
var slots={type:'Stack',props:{gap:2},children:[
  {type:'Grid',props:{columns:2},children:[
    {type:'Tile',props:{tone:'sol',title:'07:30',subtitle:'Sala 2 · Marta',height:120,onClick:'action:pick07'}},
    {type:'Tile',props:{title:'18:00',subtitle:'Sala 1',height:120,onClick:'action:pick18'}}]},
  {type:'Stack',props:{direction:'row',gap:2,align:'center'},children:[{type:'LED',props:{tone:'sol',blink:true},children:'Últimas plazas'}]}]};
function Chat(){
  var m=React.useState([
    {role:'system',text:'Hoy · 18:02'},
    {role:'user',text:'¿Tengo hueco mañana para fuerza?'},
    {role:'assistant',text:'Sí, dos. ¿Cuál te reservo?',ui:slots}]), msgs=m[0], set=m[1];
  var t=React.useState(false), toast=t[0], setToast=t[1];
  function pick(hour){ set(msgs.concat([{role:'user',text:'La de las '+hour},{role:'assistant',text:'Reservada: fuerza 1:1 mañana a las '+hour+'.',streaming:false}])); setToast(true); }
  return h('div',{className:'phone'},
    h(F.Stack,{direction:'row',justify:'space-between',align:'center'},h(F.Text,{variant:'title',sub:'Asistente'},'Kraft'),h(F.Menu,{label:'Conversación',align:'end',items:[{label:'Modo voz',icon:'mic'},{label:'Nueva',icon:'plus'}]})),
    h('div',{className:'log'},msgs.map(function(x,i){return h(F.Message,{key:i,role:x.role,ui:x.ui,actions:{pick07:function(){pick('07:30');},pick18:function(){pick('18:00');}},onCopy:x.role==='assistant'?function(){}:undefined},x.text);}),
      h(F.Toast,{open:toast,tone:'verde',icon:'check',duration:2500,onClose:function(){setToast(false);},action:{label:'Deshacer',onClick:function(){setToast(false);}}},'Reserva hecha')),
    h(F.Composer,{suggestions:['Mañana por la tarde','Solo 30 min'],onSend:function(v){set(msgs.concat([{role:'user',text:v},{role:'assistant',thinking:true}]));}}));
}
function Voice(){
  var s=React.useState('speaking'), st=s[0];
  return h('div',{className:'phone',style:{background:'var(--ink)',color:'var(--paper)',outline:'none'}},
    h(F.Text,{variant:'label',style:{color:'var(--paper)'}},'Modo voz'),
    h('div',{className:'voice'},
      h(F.VoiceOrb,{state:st,size:240,tone:'rams',level:.7}),
      h(F.Text,{variant:'body',style:{maxWidth:'280px',color:'var(--paper)'}},'"Tienes fuerza mañana a las 18:00. ¿Te aviso una hora antes?"')),
    h(F.Suggestions,{items:['Sí, avísame','No hace falta']}),
    h('div',{className:'bar'},
      h(F.KeyButton,{tone:st==='listening'?'rec':'paper',shape:'round',icon:st==='listening'?'stop':'mic','aria-label':'Hablar',onClick:function(){s[1](st==='listening'?'thinking':'listening');}}),
      h(F.KeyButton,{tone:'paper',shape:'round',icon:'close','aria-label':'Salir del modo voz'})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'screens'},h(Chat),h(Voice)));
</script>
</body>
</html>
