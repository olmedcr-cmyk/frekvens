<!doctype html>
<html lang="es">
<head><link rel="stylesheet" href="/preview/frekvens.css"><script src="/preview/react.js"></script><script src="/preview/react-dom.js"></script><script src="/preview/frekvens.js"></script><script>try{var t=parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);new MutationObserver(function(){document.documentElement.setAttribute('data-theme',parent.document.documentElement.getAttribute('data-theme'))}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}</script><meta charset="utf-8"><title>PantallaRelojes</title>
<style>
  .screens { display:flex; gap:var(--space-5); padding:var(--space-5); flex-wrap:wrap; align-items:flex-start; }
  .phone { position:relative; width:390px; height:800px; box-sizing:border-box; border-radius:48px; padding:var(--space-8) var(--space-5) var(--space-5); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }
  .card { box-sizing:border-box; border-radius:var(--radius-xl); background:var(--surface); padding:var(--space-5); display:flex; flex-direction:column; gap:var(--space-4); }
  .cap { font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); margin:0; }
  .wide { width:1180px; box-sizing:border-box; }
  .row { display:flex; gap:var(--space-4); flex-wrap:wrap; align-items:center; }
  .push { margin-top:auto; }
 .discard { background:#c9c3b6; }
  html:not([data-theme="dark"]) .discard { --ink-muted:#3d3934; }
  html[data-theme="dark"] .discard { background:#2a2723; }
  .world { display:flex; flex-direction:column; gap:12px; }

</style></head>
<body>
<div id="root"></div>
<script>
var F = window.Frekvens, h = React.createElement;
function Card(){return h('div',{className:'phone discard',style:{alignItems:'center',justifyContent:'center'}},h(F.Clock,{size:300,caption:'Ahora'}),h(F.Text,{variant:'title',style:{textAlign:'center'},sub:'Jueves 6 de noviembre'},'Vigo'));}
function World(){var c=[['Vigo','10:09'],['Nueva York','05:09'],['Tokio','18:09'],['São Paulo','07:09']];return h('div',{className:'phone'},h(F.TopBar,{title:'Reloj mundial',large:true}),
  h('div',{className:'world'},c.map(function(x,i){return h('div',{key:i,className:'card',style:{flexDirection:'row',alignItems:'center',padding:'16px'}},h(F.Clock,{time:x[1],variant:i%2?'ticks':'disc',size:72,seconds:false}),h(F.Text,{variant:'body-strong',sub:x[1]},x[0]));})),
  h('div',{className:'push'},h(F.KeyButton,{tone:'klein',shape:'pill',block:true,icon:'plus'},'Añadir ciudad')));}
function Dot(){return h('div',{className:'phone',style:{background:'#111',color:'#f1ece2',alignItems:'center',justifyContent:'center'}},h(F.Clock,{variant:'dot',size:320,tone:'paper'}),h('p',{className:'cap',style:{color:'#c9c1b3'}},'Siempre visible'));}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'screens'},h(Card),h(World),h(Dot)));
</script>
</body>
</html>
