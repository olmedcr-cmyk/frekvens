<!doctype html>
<html lang="es">
<head><link rel="stylesheet" href="/preview/frekvens.css"><script src="/preview/react.js"></script><script src="/preview/react-dom.js"></script><script src="/preview/frekvens.js"></script><script>try{if(parent!==window){var t=parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);new MutationObserver(function(){document.documentElement.setAttribute('data-theme',parent.document.documentElement.getAttribute('data-theme'))}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}}catch(e){}</script><meta charset="utf-8"><title>AppBienvenida</title>
<style>
  .app { width:min(390px,100%); margin:0 auto; box-sizing:border-box; border-radius:44px; padding:var(--space-6) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); outline-offset:calc(var(--hairline) * -1); overflow:hidden; }

  .bento .wide .frk-tile__value { font-size:64px; }
  .card { display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; min-width:0; }

  .list { display:flex; flex-direction:column; gap:var(--space-2); }

</style></head>

<div id="root" class="frk-pad"></div>
<script>
var F = window.Frekvens, h = React.createElement, no = function(){};
function App(){
 return h('div',{className:'app'},
  h('div',{className:'row'},h(F.Text,{variant:'headline',as:'h1'},'Moneda'),h(F.Chip,null,'ES')),
  h(F.Onboarding,{onSkip:no,slides:[

   {eyebrow:'Listo',title:'Empieza hoy.',text:'Sin comisiones el primer año.',tone:'klein-soft',art:h(F.Shape,{name:'disc',size:132,tone:'rams'})}]}));
}
