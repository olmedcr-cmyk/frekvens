<!doctype html>
<html lang="es">
<head><link rel="stylesheet" href="/preview/frekvens.css"><script src="/preview/react.js"></script><script src="/preview/react-dom.js"></script><script src="/preview/frekvens.js"></script><script>try{if(parent!==window){var t=parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);new MutationObserver(function(){document.documentElement.setAttribute('data-theme',parent.document.documentElement.getAttribute('data-theme'))}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}}catch(e){}</script><meta charset="utf-8"><title>AppFinanzas</title>
<style>
  .app { width:min(390px,100%); margin:0 auto; box-sizing:border-box; border-radius:44px; padding:var(--space-6) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); outline-offset:calc(var(--hairline) * -1); overflow:hidden; }
  .bento { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
  .bento > * { min-width:0; }
  .wide { grid-column:1 / -1; }
  .bento .frk-tile { height:100%; }
  .bento .frk-tile__value { font-size:40px; }
  .bento .wide .frk-tile__value { font-size:64px; }
  .card { display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; min-width:0; }
  .cap { margin:0; font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
  .row { display:flex; gap:var(--space-3); align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .list { display:flex; flex-direction:column; gap:var(--space-2); }
  .app .frk-tabbar { align-self:center; }
</style></head>
<body>
<div id="root" class="frk-pad"></div>
<script>
var F = window.Frekvens, h = React.createElement, no = function(){};
function App(){
 return h('div',{className:'app'},
  h('div',{className:'row'},h(F.Text,{variant:'title',as:'h1',sub:'Piso de la calle Real'},'Cuentas'),
   h('div',{style:{display:'flex',gap:'var(--space-1)'}},h(F.Avatar,{name:'Lucía Varela',size:36,tone:'klein'}),h(F.Avatar,{name:'Mateo Sanz',size:36,tone:'rams'}))),
  h(F.Stat,{label:'Te deben',value:'46,20',unit:'€',delta:'+12,80 € esta semana',trend:[12,18,15,22,30,34,46]}),
  h('div',{className:'card'},h('p',{className:'cap'},'Quién ha pagado en noviembre'),
   h(F.SplitBar,{segments:[{label:'Lucía',value:212,tone:'klein'},{label:'Tú',value:168,tone:'sol'},{label:'Mateo',value:95,tone:'rams'}],format:function(v){return v+' €';}})),
  h('div',{className:'bento'},
   h(F.Tile,{tone:'klein',icon:'plus',anchor:'bottom',title:'Añadir gasto',subtitle:'Se reparte solo',height:144,onClick:no}),
   h(F.Tile,{tone:'surface',icon:'check',anchor:'bottom',title:'Saldar',subtitle:'Con Mateo · 18,40 €',height:144,onClick:no})),
  h('div',{className:'card'},h('p',{className:'cap'},'Últimos gastos'),h('div',{className:'list'},
   h(F.ListRow,{icon:'card',title:'Mercado de abastos',detail:'Lucía · sábado',value:'38,60 €'}),
   h(F.ListRow,{icon:'bolt',title:'Factura de la luz',detail:'Tú · 2 nov',value:'71,15 €'}),
   h(F.ListRow,{icon:'home',title:'Bombona de butano',detail:'Mateo · 30 oct',value:'24,00 €'}))),
  h(F.TabBar,{label:'Secciones',items:[{id:'g',label:'Gastos',icon:'home'},{id:'s',label:'Saldos',icon:'chart'},{id:'p',label:'Personas',icon:'user'}]}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
