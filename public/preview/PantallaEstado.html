<!doctype html>
<html lang="es">
<head><link rel="stylesheet" href="/preview/frekvens.css"><script src="/preview/react.js"></script><script src="/preview/react-dom.js"></script><script src="/preview/frekvens.js"></script><script>try{if(parent!==window){var t=parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);new MutationObserver(function(){document.documentElement.setAttribute('data-theme',parent.document.documentElement.getAttribute('data-theme'))}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}}catch(e){}</script><meta charset="utf-8"><title>Pantalla · Estado</title>
<style>
  .screens { display:flex; gap:var(--space-6); padding:var(--space-5); flex-wrap:wrap; }
  .phone { width:390px; height:800px; box-sizing:border-box; border-radius:48px; padding:var(--space-8) var(--space-5) var(--space-5); display:flex; flex-direction:column; gap:var(--space-5); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }
  .phone h1 { margin:0; font:800 40px/.95 var(--font-sans); letter-spacing:-.03em; }
  .phone h1 span { color:var(--ink-muted); display:block; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
  .grow { flex:1; display:flex; align-items:center; justify-content:center; }
  .nav { display:flex; justify-content:space-between; align-items:center; font:700 16px/22px var(--font-sans); }
  .nav .ghost { color:var(--ink-muted); }
</style></head>
<body>
<div id="root"></div>
<script>
var C = window.Frekvens, h = React.createElement;
function Home(){
  return h('div',{className:'phone'},
    h('h1',null,'Semana',h('span',null,'3 de 5 sesiones')),
    h('div',{className:'grow'},h(C.BarMeter,{active:2,height:180,barWidth:44,data:[{label:'L',value:40},{label:'M',value:70},{label:'X',value:95},{label:'J',value:50,hatched:true},{label:'V',value:60,hatched:true}]})),
    h('div',{className:'two'},
      h(C.Tile,{title:'Cardio',subtitle:'Zona 2',tone:'sol',value:'42′'},h(C.DotMatrix,{shape:'heart',dot:4,pitch:6})),
      h(C.Tile,{title:'Fuerza',subtitle:'Series',value:'18'},h(C.DotGrid,{total:12,filled:7,columns:4,size:16,gap:5,tone:'ink'}))),
    h('div',{className:'nav'},h(C.Icon,{name:'arrow-left',title:'Anterior'}),h('span',null,'Hoy'),h('span',{className:'ghost'},'Mañana')));
}
function Panel(){
  return h('div',{className:'phone',style:{background:'var(--ink)',gap:'8px',padding:'64px 12px 12px'}},
    h(C.Strip,{title:'Temperatura',value:'24°'},h(C.DotMatrix,{shape:'sun',dot:3,pitch:5,tone:'tabaco'})),
    h(C.Strip,{title:'Luz difusa',value:'ON'},h(C.Gauge,{value:80,width:150,thickness:12})),
    h(C.Strip,{title:'Batería',value:'78%'},h(C.LevelBars,{value:78,count:14,height:56})),
    h(C.Strip,{title:'Estado',value:'3/5'},h('div',{style:{display:'flex',gap:'6px'}},h(C.StateMark,{state:'full'}),h(C.StateMark,{state:'full'}),h(C.StateMark,{state:'full'}),h(C.StateMark,{state:'partial'}),h(C.StateMark,{state:'empty'}))),
    h(C.Strip,{tone:'tabaco',value:'19:53'},h('div',{style:{font:'400 18px/22px var(--font-sans)'}},'Jueves',h('br'),'5 noviembre')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'screens'},h(Home),h(Panel)));
</script>
</body>
</html>
