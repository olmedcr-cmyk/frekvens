<!-- @dsCard group="Pantallas" height=900 width=1240 page subtitle="Panel denso: KPIs con tendencia, línea, semitono, reparto, barras y tabla" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>PantallaAnalitica</title>
<style>
  .screens { display:flex; gap:var(--space-6); padding:var(--space-5); flex-wrap:wrap; align-items:flex-start; }
  .phone { position:relative; width:390px; height:800px; box-sizing:border-box; border-radius:48px; padding:var(--space-8) var(--space-5) var(--space-5); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }
  .tablet { position:relative; width:1180px; height:820px; box-sizing:border-box; border-radius:36px; padding:var(--space-4); display:flex; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); overflow:hidden; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--space-4); }
  .row { display:flex; gap:var(--space-2); }
  .push { margin-top:auto; }
  .cap { font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
 .dash { display:grid; grid-template-columns:repeat(4, 1fr); gap:var(--space-2); }
  .k { display:flex; flex-direction:column; justify-content:space-between; gap:var(--space-2); min-height:132px; padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; }
  .k .v { font:400 44px/1 var(--font-sans); letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .k .t { display:flex; justify-content:space-between; align-items:flex-end; }
  .card { padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; display:flex; flex-direction:column; gap:var(--space-3); min-width:0; }
  .s2 { grid-column:span 2; } .s4 { grid-column:span 4; }
</style></head>
<body>
<div id="root"></div>
<script>
var F = window.Frekvens, h = React.createElement;
var heat=[];for(var i=0;i<30*7;i++){var x=Math.sin(i*1.3)*Math.cos(i*.21);heat.push(x>-.3?Math.round((x+.3)*50):0);}
function K(l,v,d,data,tone){return h('div',{className:'k'},h(F.Text,{variant:'label'},l),h('div',{className:'t'},h('span',{className:'v'},v),h(F.Sparkline,{data:data,tone:tone,label:l})),h(F.Text,{variant:'caption',muted:true},d));}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'screens'},h('div',{className:'tablet',style:{height:'860px'}},
 h(F.Sidebar,{defaultCollapsed:true,sections:[{items:[{id:'a',label:'Analítica',icon:'home'},{id:'b',label:'Reservas',icon:'timer',count:4},{id:'c',label:'Clientes',icon:'copy'},{id:'d',label:'Ajustes',icon:'dots'}]}]}),
 h('div',{className:'main'},
  h(F.Stack,{direction:'row',justify:'space-between',align:'flex-end'},h(F.Text,{variant:'display-xl',sub:'Noviembre · 30 días'},'Analítica'),h(F.Segmented,{label:'Periodo',options:['7 d','30 d','Año'],defaultValue:'30 d'})),
  h('div',{className:'dash'},
   K('Ingresos','18,4k','+12 % vs. octubre',[3,4,4,6,5,7,9],'ink'),K('Sesiones','1.284','+4 %',[5,6,5,7,7,8,8],'ink'),K('Ocupación','72 %','−3 %',[9,8,8,7,7,6,7],'rams'),K('Cancelaciones','38','dentro de lo normal',[4,3,5,4,3,4,3],'klein'),
   h('div',{className:'card s2'},h(F.Text,{variant:'headline',as:'h2',sub:'Hoy a las 18:00 es el pico'},'Ocupación por hora'),h(F.LineChart,{data:[10,14,22,30,26,34,48,66,58,40],labels:['8','10','12','14','16','18','20','22','23','24'],now:5,width:520,height:150,unit:'%',label:'Ocupación'})),
   h('div',{className:'card'},h(F.Text,{variant:'headline',as:'h2'},'Reparto'),h(F.SplitBar,{segments:[{label:'Grupo',value:58},{label:'Solo',value:27},{label:'Online',value:15}]})),
   h('div',{className:'card'},h(F.Text,{variant:'headline',as:'h2'},'Semana'),h(F.BarMeter,{active:3,height:110,barWidth:18,data:[{label:'L',value:40},{label:'M',value:62},{label:'X',value:55},{label:'J',value:90},{label:'V',value:70},{label:'S',value:30,hatched:true},{label:'D',value:20,hatched:true}]})),
   h('div',{className:'card s2'},h(F.Text,{variant:'headline',as:'h2'},'Actividad diaria'),h(F.Heatmap,{data:heat,cell:16,caption:'Sesiones por día · 30 semanas'})),
   h('div',{className:'card s2'},h(F.Text,{variant:'headline',as:'h2'},'Objetivos'),h(F.Stack,{direction:'row',gap:5},h(F.ProgressRing,{value:72,label:'Ocupación'}),h(F.ProgressRing,{value:91,tone:'klein',label:'Retención'}),h(F.ProgressRing,{value:48,tone:'ink',label:'Bonos'}),h(F.Gauge,{value:64,width:150,unit:'',caption:'NPS'})))
  )))));
</script>
</body>
</html>
