<!-- @dsCard group="Apps" height=1060 page subtitle="Hogar: cada aparato en una fila de color con su lectura, y el mando del aire" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AppHogar</title>
<style>
  .app { width:min(390px,100%); margin:0 auto; box-sizing:border-box; border-radius:44px; padding:var(--space-6) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); outline-offset:calc(var(--hairline) * -1); overflow:hidden; }
  .bento { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
  .bento > * { min-width:0; }
  .wide { grid-column:1 / -1; }
  .bento .frk-tile { height:100%; }
  .bento .frk-tile__value { font-size:40px; }
  .bento .wide .frk-tile__value { font-size:64px; }
  .card { display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; min-width:0; }
  .cap { margin:0; font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
  .row { display:flex; gap:var(--space-3); align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .list { display:flex; flex-direction:column; gap:var(--space-2); }
  .app .frk-tabbar { align-self:center; }
  .stack { display:flex; flex-direction:column; gap:var(--space-1); }
  .center { display:flex; flex-direction:column; align-items:center; gap:var(--space-4); }
</style></head>
<body>
<div id="root" class="frk-pad"></div>
<script>
var F = window.Frekvens, h = React.createElement, no = function(){};
function App(){
 return h('div',{className:'app'},
  h(F.TopBar,{as:'header',title:'Dispositivos',actions:h(F.KeyButton,{tone:'well',size:'s',shape:'round',icon:'menu','aria-label':'Menú'})}),
  h('div',{className:'stack'},
   h(F.Strip,{tone:'salvia',icon:'sun',title:'Aire',value:'24',unit:'°C'},h(F.Chip,{tone:'paper',dot:true},'Encendido')),
   h(F.Strip,{tone:'rams',icon:'refresh',title:'Ventilador',value:'80',unit:'km/h'},h(F.Chip,{tone:'paper',dot:true},'Encendido')),
   h(F.Strip,{tone:'malva',icon:'drop',title:'Lavadora',value:'8',unit:'kW'},h(F.Chip,{tone:'paper'},'42 min')),
   h(F.Strip,{tone:'klein',icon:'bolt',title:'Nevera',value:'4',unit:'kW'},h(F.Chip,{tone:'paper',dot:true},'Encendido')),
   h(F.Strip,{tone:'klein-soft',icon:'power',title:'Cargador',value:'2',unit:'kW'},h(F.Chip,{tone:'paper'},'Apagado'))),
  h('div',{className:'card center'},h('p',{className:'cap'},'Aire · temperatura'),h(F.Dial,{label:'Temperatura',min:16,max:30,defaultValue:24,size:168}),h(F.Segmented,{label:'Estado del aire',options:['Encendido','Apagado'],defaultValue:'Encendido'})),
  h(F.TabBar,{label:'Secciones',items:[{id:'c',label:'Casa',icon:'home'},{id:'e',label:'Energía',icon:'bolt'},{id:'a',label:'Ajustes',icon:'sliders'}]}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
