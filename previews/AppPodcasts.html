<!-- @dsCard group="Apps" height=1100 page subtitle="Podcasts: radio de autor con portadas de formas geométricas y una regla para moverse por los días" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AppPodcasts</title>
<style>
  .app { width:min(390px,100%); margin:0 auto; box-sizing:border-box; border-radius:44px; padding:var(--space-6) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); outline:var(--hairline) solid var(--line); outline-offset:calc(var(--hairline) * -1); overflow:hidden; }
  .bento { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
  .bento > * { min-width:0; }
  .wide { grid-column:1 / -1; }
  .bento .frk-tile { height:100%; }
  .bento .frk-tile__value { font-size:40px; }
  .bento .wide .frk-tile__value { font-size:64px; }
  .card { display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; min-width:0; }
  .cap { margin:0; font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
  .row { display:flex; gap:var(--space-3); align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .list { display:flex; flex-direction:column; gap:var(--space-2); }
  .app .frk-tabbar { align-self:center; }
</style></head>
<body>
<div id="root" class="frk-pad"></div>
<script>
var F = window.Frekvens, h = React.createElement, no = function(){};
function App(){
 return h('div',{className:'app'},
  h(F.Text,{variant:'display-xl',sub:'Radio de autor'},'Escuchar'),
  h(F.Ruler,{label:'Día',min:1,max:30,major:5,pitch:14,defaultValue:14,format:function(v){return v===14?'Hoy':'Día '+v;}}),
  h('div',{className:'bento'},
   h('div',{className:'wide'},h(F.Tile,{tone:'tabaco',meta:'Nuevo',title:'Sobremesa',subtitle:'Episodio 112 · 41 min',caption:'Charlas largas después de comer',height:224,onClick:no},h(F.Shape,{name:'half',size:112,soft:true}))),
   h(F.Tile,{tone:'verde',title:'Kilómetro cero',subtitle:'Cocina de temporada',caption:'Marta Iglesias',height:208,onClick:no},h(F.Shape,{name:'steps',size:80,soft:true})),
   h(F.Tile,{tone:'sol',title:'Onda corta',subtitle:'Radio y técnica',caption:'Pablo Rey',height:208,onClick:no},h(F.Shape,{name:'cross',size:80,soft:true})),
   h(F.Tile,{tone:'klein-soft',title:'La hora azul',subtitle:'Cuentos para dormir',caption:'Inés Calvo',height:208,onClick:no},h(F.Shape,{name:'disc',size:80,soft:true})),
   h(F.Tile,{tone:'surface',title:'Paso a paso',subtitle:'Caminar la ciudad',caption:'Tomás Lago',height:208,onClick:no},h(F.Shape,{name:'arch',size:80,soft:true}))),
  h(F.TabBar,{label:'Secciones',items:[{id:'i',label:'Inicio',icon:'home'},{id:'b',label:'Buscar',icon:'search'},{id:'g',label:'Guardado',icon:'bookmark'}]}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
