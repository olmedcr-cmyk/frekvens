<!-- @dsCard group="Apps" height=860 page subtitle="Reproductor: pila de pistas, onda y controles grandes" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AppMusica</title>
<style>
  .app { width:min(390px,100%); margin:0 auto; box-sizing:border-box; border-radius:44px; padding:var(--space-6) var(--space-4) var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); background:var(--paper); overflow:hidden; }
  .bento { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
  .bento > * { min-width:0; }
  .wide { grid-column:1 / -1; }
  .bento .frk-tile { height:100%; }
  .bento .frk-tile__value { font-size:40px; }
  .bento .wide .frk-tile__value { font-size:64px; }
  .card { display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--surface); box-sizing:border-box; min-width:0; }
  .cap { margin:0; font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
  .row { display:flex; gap:var(--space-3); align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .list { display:flex; flex-direction:column; gap:var(--space-2); }
  .app .frk-tabbar { align-self:center; }
</style></head>
<body>
<div id="root" class="frk-pad"></div>
<script>
var F = window.Frekvens, h = React.createElement;
function App(){
 var s=React.useState(0);
 return h('div',{className:'app'},
  h(F.Text,{variant:'display-xl',sub:'Lado A'},'Mezcla'),
  h(F.CardStack,{value:s[0],onChange:s[1],items:[{badge:'A',icon:'play',title:'Costa de niebla',subtitle:'Las Horas',value:'12',tone:'lavanda'},{badge:'Q',icon:'arrow-right',title:'Tarde sin viento',subtitle:'Nora Vidal',value:'38',tone:'well'},{badge:'7',icon:'arrow-right',title:'Corazón de verano',subtitle:'Río Sur',value:'89',tone:'rams'}]}),
  h(F.AudioTrack,{title:'Costa de niebla · Las Horas',duration:214,seed:4,tone:'surface',speed:false}),
  h('div',{className:'bento'},
   h(F.Tile,{tone:'ink',title:'Tempo',subtitle:'pulsos por minuto',value:'96',height:152}),
   h(F.Tile,{tone:'sol',title:'Tono',subtitle:'La menor',value:'Am',height:152})),
  h(F.Slider,{label:'Volumen',defaultValue:60,stops:['Bajo','Medio','Alto']}),
  h(F.TabBar,{label:'Secciones',items:[{id:'m',label:'Mezcla',icon:'play'},{id:'r',label:'Radio',icon:'volume'},{id:'b',label:'Buscar',icon:'dots'}]}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
